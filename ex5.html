<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 2em;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 1em;
        }
        .input-group {
            margin-bottom: 1em;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5em;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 0.8em;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 1em;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result-container {
            margin-top: 1.5em;
            font-size: 1.1em;
            font-weight: bold;
        }
        #bmi-value {
            font-size: 1.5em;
            color: #333;
            margin-top: 0.5em;
        }
        #bmi-status {
            margin-top: 0.5em;
        }
        .underweight { color: #5bc0de; }
        .normal { color: #28a745; }
        .overweight { color: #ffc107; }
        .obese { color: #dc3545; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BMI Calculator</h1>
        <div class="input-group">
            <label for="weight">Weight (in kg):</label>
            <input type="number" id="weight" required>
        </div>
        <div class="input-group">
            <label for="height">Height (in meters):</label>
            <input type="number" id="height" step="0.01" required>
        </div>
        <button onclick="calculateBMI()">Calculate BMI</button>
        <div id="result-container">
            <p>Your BMI is: <span id="bmi-value"></span></p>
            <p id="bmi-status"></p>
        </div>
    </div>

    <script>
        function calculateBMI() {
            // Get user input values from the form
            var weight = parseFloat(document.getElementById("weight").value);
            var height = parseFloat(document.getElementById("height").value);

            // Get the display elements
            var bmiValueElement = document.getElementById("bmi-value");
            var bmiStatusElement = document.getElementById("bmi-status");

            // Clear previous results and classes
            bmiValueElement.textContent = "";
            bmiStatusElement.textContent = "";
            bmiStatusElement.className = "";

            // Validate input
            if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
                alert("Please enter valid weight and height values.");
                return;
            }

            // Calculate BMI
            var bmi = weight / (height * height);

            // Display BMI value, rounded to two decimal places
            bmiValueElement.textContent = bmi.toFixed(2);

            // Determine and display BMI status based on the criteria
            var status;
            if (bmi < 18) {
                status = "Underweight";
                bmiStatusElement.className = "underweight";
            } else if (bmi >= 18 && bmi < 25) {
                status = "Normal";
                bmiStatusElement.className = "normal";
            } else if (bmi >= 25 && bmi < 30) {
                status = "Overweight";
                bmiStatusElement.className = "overweight";
            } else {
                status = "Obese";
                bmiStatusElement.className = "obese";
            }

            bmiStatusElement.textContent = "Status: " + status;
        }
    </script>

</body>
</html>
